<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ApproveAccept decision</title><style>
:root{--ground:oklch(0.19 0.018 55);--panel:oklch(0.235 0.02 55);--raise:oklch(0.28 0.022 55);--ink:oklch(0.95 0.012 80);--mute:oklch(0.73 0.02 70);--line:oklch(0.35 0.02 55);--acc:oklch(0.85 0.13 190);--accink:oklch(0.22 0.04 200);--accsoft:oklch(0.85 0.13 190 / .16);--red:oklch(0.68 0.2 25);--ok:oklch(0.8 0.12 160);--sans:system-ui,sans-serif;color-scheme:dark}
:root[data-theme=light]{--ground:oklch(0.965 0.012 80);--panel:oklch(0.99 0.006 80);--raise:oklch(0.93 0.015 75);--ink:oklch(0.25 0.025 55);--mute:oklch(0.5 0.02 60);--line:oklch(0.86 0.015 70);--acc:oklch(0.5 0.12 200);--accink:oklch(0.98 0.01 200);--accsoft:oklch(0.5 0.12 200 / .12);--red:oklch(0.55 0.19 25);--ok:oklch(0.5 0.12 160);color-scheme:light}
:root{--ground:#171714;--panel:#24241f;--ink:#f3f1e8;--mute:#aaa99f;--line:#414139;--acc:#62d7d2;--accink:#102c2c;--red:#ff9187;--ok:#83d8a6;--sans:ui-sans-serif,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.4 var(--sans);overflow-x:hidden}main{width:100%;max-width:460px;margin:auto;padding:15px 12px 42px;overflow:hidden}.top{display:flex;align-items:center}.brand{font-weight:800}.brand i{color:var(--acc);font-style:normal}.sandbox{margin-left:auto;color:var(--mute);font-size:12px}.card{width:100%;margin-top:26px;border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden}.summary{padding:18px}.ey{color:var(--acc);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.rank{float:right;color:var(--mute);font-size:12px;text-transform:none;letter-spacing:0}h1{font-size:26px;line-height:1.08;margin:10px 0 4px;overflow-wrap:anywhere}.amount{font-size:32px;font-weight:800;margin:4px 0 12px}.signals{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--mute);font-size:12px}.chip.risk{color:var(--red)}.chip.allowance{color:var(--ok)}.why{margin:14px 0 0;font-size:16px;overflow-wrap:anywhere}.actions{padding:0 18px 18px}button{width:100%;min-height:50px;padding:10px 12px;border-radius:13px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);font-weight:800;font-size:16px}button.refuse{min-height:38px;margin-top:6px;background:transparent;color:var(--mute);border-color:transparent;font-size:14px}button:disabled{opacity:.45}.status{margin-top:10px;color:var(--mute);font-size:13px;overflow-wrap:anywhere}.passkey{margin:0 18px 14px;padding:10px 0;border-top:1px solid var(--line);color:var(--mute);font-size:13px}.passkey strong{color:var(--ink)}details{border-top:1px solid var(--line);padding:0 18px}summary{padding:13px 0;cursor:pointer;font-weight:700}.detail{padding:0 0 16px}.meta{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px 9px}.meta span{color:var(--mute)}.meta b{overflow-wrap:anywhere}.policy{padding:12px 18px;border-top:1px solid var(--line);font-size:13px}.policy ul{padding-left:18px}.policy li{margin:7px 0}.source-note{color:var(--mute);font-size:12px;margin-top:12px}.reason,.plan{margin-top:12px;color:var(--mute)}.suggestions{padding:18px;border-top:1px solid var(--line)}.suggestion{padding:12px 0;border-top:1px solid var(--line)}.suggestion:first-of-type{border:0}.suggestion b,.suggestion span{display:block}.suggestion span{color:var(--mute);margin:4px 0 9px}.suggestion button{min-height:40px;font-size:14px}a{color:var(--acc)}
</style></head><body><main><div class=top><span class=brand>ApproveAccept<i>.</i></span><span class=sandbox>Local substitute</span></div><section class=card id=card><div class=summary><div class=ey>Loading request</div></div></section></main><script>
const card=document.querySelector('#card'),params=new URLSearchParams(location.search),token=params.get('token'),enrol=params.get('enrol'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')};const bin=s=>Uint8Array.from(atob(s.replaceAll('-','+').replaceAll('_','/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));function decode(options){options.publicKey.challenge=bin(options.publicKey.challenge);if(options.publicKey.user)options.publicKey.user.id=bin(options.publicKey.user.id);if(options.publicKey.allowCredentials)options.publicKey.allowCredentials.forEach(x=>x.id=bin(x.id));return options}
async function load(){const r=await fetch('/api/approval?token='+encodeURIComponent(token||''));data=await r.json();if(!r.ok)throw Error(data.error||'Could not load request');document.querySelector('.sandbox').textContent=data.substitute?'Local substitute · no PayPal call':'PayPal Sandbox';const done=data.used||data.state!=='authorized',q=data.queue_context||{},reasons=(data.reasons||[]).join(' ')||'Spend rules sent this request to you.',plan=data.subscription?`<div class=plan>Monthly plan · reminder ${esc(data.subscription.reminder_at)} · renewal ${esc(data.subscription.renewal_at)}</div>`:'',passkey=data.passkey_ready?`<div class=passkey><strong>Face ID checks this exact purchase.</strong><br>${esc(data.amount)} at ${esc(data.merchant)} is bound into the signed challenge.</div>`:data.passkey_configured?`<div class=passkey><strong>No passkey enrolled.</strong><br>Nothing can be captured. Set up Face ID from the dashboard.</div>`:`<div class=passkey><strong>HTTPS setup required.</strong><br>Nothing can be captured yet.</div>`,suggestions=(data.suggestions||[]).length?`<div class=suggestions><div class=ey>Possible follow-ups</div>${data.suggestions.map(s=>`<div class=suggestion><b>${esc(s.title)} · ${esc(s.amount)}</b><span>${esc(s.why)}</span><button onclick="suggest(${s.id},this)">Request separately</button><div class=status id="suggestion-${s.id}"></div></div>`).join('')}</div>`:'';card.innerHTML=`<div class=summary><div class=ey>${done?'Decision recorded':'Next decision'}<span class=rank>${!done&&q.rank?'#'+q.rank+' of '+data.needs_me_count:''}</span></div><h1>${esc(data.title)}</h1><div class=amount>${esc(data.amount)}${data.subscription?' / month':''}</div><div class=signals><span class="chip risk">${done?'Recorded':'Owner review'}</span><span class="chip allowance">${esc(q.allowance||'Spend rules')}</span></div><p class=why>${esc(data.why)}</p><div class=source-note>${esc(data.agent)} requests this from ${esc(data.merchant)}.<br>Request ${esc(data.id)}</div></div>${data.context?.policy?`<div class=policy><b>${esc(data.context.policy.source)} · at request time</b><p>${esc(data.context.policy.lines[0])}</p><b>${esc(reasons)}</b><details style="padding:0;border:0"><summary>All rules used for this request</summary><ul>${data.context.policy.lines.slice(1,-2).map(line=>`<li>${esc(line)}</li>`).join('')}</ul></details>${data.context.product_url?`<p><a href="${esc(data.context.product_url)}" target=_blank rel="noopener noreferrer">View product or pricing ↗</a></p>`:''}<div class=source-note>Agent-supplied item, merchant and price. Sandbox payee: ${esc(data.context.policy.sandbox_payee_id)}. No real seller is paid.</div></div>`:''}${passkey}<div class=actions><button ${done||!data.passkey_ready?'disabled':''} onclick="choose('approve')">Approve with Face ID</button><button class=refuse ${done?'disabled':''} onclick="choose('refuse')">Refuse this request</button><div class=status>${done?'Current state: '+esc(data.state):'One approval. One exact purchase.'}</div></div><details><summary>Why this needs me</summary><div class=detail><div class=meta><span>Request</span><b>${esc(data.id)}</b><span>Agent</span><b>${esc(data.agent)}</b><span>Merchant</span><b>${esc(data.merchant)}</b><span>Category</span><b>${esc(data.category)}</b><span>Task</span><b>${esc(data.task)}</b></div><div class=reason>${esc(reasons)}</div>${plan}</div></details>${suggestions}`}
async function assertion(){const r=await fetch('/api/passkey/options?token='+encodeURIComponent(token)),o=await r.json();if(!r.ok)throw Error(o.error||'Cannot start Face ID');decode(o);const response=await navigator.credentials.get({publicKey:o.publicKey});return{flow:o.flow,id:response.id,clientDataJSON:b64(response.response.clientDataJSON),authenticatorData:b64(response.response.authenticatorData),signature:b64(response.response.signature)}}
async function choose(action){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const proof=action==='approve'?await assertion():null,r=await fetch('/api/phone-decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,assertion:proof})}),j=await r.json();if(!r.ok)throw Error(j.error||'Decision failed');await load()}catch(e){card.querySelector('.status').textContent=e.message;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(!data.passkey_ready)card.querySelector('.actions button').disabled=true}}
async function enrolPhone(){card.innerHTML='<div class=summary><div class=ey>First use</div><h1>Set up Face ID</h1><p>This passkey will approve future purchases on this phone.</p></div><div class=actions><button id=setup>Set up Face ID</button><div class=status></div></div>';setup.onclick=async()=>{setup.disabled=true;const status=card.querySelector('.status');try{status.textContent='Waiting for Face ID';const r=await fetch('/api/passkey/enrol/options?token='+encodeURIComponent(enrol)),o=await r.json();if(!r.ok)throw Error(o.error||'Cannot start enrolment');decode(o);const response=await navigator.credentials.create({publicKey:o.publicKey}),key=response.response.getPublicKey&&response.response.getPublicKey();if(!key)throw Error('This browser cannot export the passkey public key');const payload={flow:o.flow,token:enrol,id:response.id,clientDataJSON:b64(response.response.clientDataJSON),authenticatorData:b64(response.response.getAuthenticatorData()),publicKey:b64(key)},saved=await fetch('/api/passkey/enrol',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),result=await saved.json();if(!saved.ok)throw Error(result.error||'Enrolment refused');card.innerHTML='<div class=summary><div class=ey>Passkey ready</div><h1>Face ID is now required</h1><p>Return to the purchase approval link.</p></div>'}catch(e){status.textContent=e.message;setup.disabled=false}}}
async function suggest(id,button){button.disabled=true;const out=document.querySelector('#suggestion-'+id),r=await fetch('/api/suggestion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,suggestion_id:id})}),j=await r.json();if(!r.ok){out.textContent=j.error||'Request failed';button.disabled=false;return}out.innerHTML=`Held, not paid. <a href="${esc(j.approval_url)}">Open separate approval</a>.`}
(enrol?enrolPhone():load()).catch(e=>card.innerHTML=`<div class=summary><div class=ey>Link unavailable</div><h1>${esc(e.message)}</h1></div>`);
</script></body></html>
